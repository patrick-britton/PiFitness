# deploy/tests.conf
# Test suites run by the autodeploy steps. Plain KEY=value lines (not shell-expanded by the parser);
# quote the values. Read from the checked-out commit AFTER the checkout step.
#
# CONTRACT
#   REGRESSION_<NAME>   one suite run by step_regression (TEST step 6, later PRD step 8), in file order.
#   SMOKE_<NAME>        one suite run by the smoke step (not built yet; ignored by step_regression).
#   The value is a shell command run with `bash -c`; $VARIABLES expand there. Exported to it:
#       APP_DIR     the checkout                      VENV_DIR   the Python venv (outside APP_DIR)
#       LOG_DIR     autodeploy log dir                REPORT     the junit XML file THIS suite must write
#       REPORT_DIR  <run-dir>/reports
#   The command must cd where it needs to be and exit 0 only if the suite passed. Write junit XML to
#   $REPORT: that is where the passed/failed/skipped counts and the failing test names come from.
#   The backend reads backend/.env, which the checkout step links to this run's env file, so the
#   tests can only reach that environment's database. Nothing here names a database.

# Backend: the venv's own interpreter (no `uv run`, which could re-sync the venv).
REGRESSION_PYTEST="cd $APP_DIR && $VENV_DIR/bin/python -m pytest --junitxml=$REPORT"

# Frontend: vitest (npm test = "vitest run"), junit reporter, non-interactive.
REGRESSION_NPM="cd $APP_DIR/frontend/pifitness && CI=true npm test -- --reporter=junit --outputFile=$REPORT"

# Smoke: runs against the running stack (FastAPI backend + live database)
SMOKE_PYTEST="cd $APP_DIR && $VENV_DIR/bin/python -m pytest -m smoke --junitxml=$REPORT"
