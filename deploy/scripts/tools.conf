# deploy/scripts/tools.conf
# Pinned non-pip tools. Read by step_dependencies.py (installs / verifies them) and by
# step_preflight.py (INSTALLABLE_TOOLS only). Plain KEY=value lines, not shell-expanded;
# quote values with spaces. Lives beside autodeploy.conf so the launcher extracts it with
# the rest of deploy/scripts.
#
# Python packages (uv.lock) and Node packages (package-lock.json) are NOT listed here:
# their lockfiles are the manifest.

# PATH binaries that step_dependencies installs. The preflight reports them present/missing
# but never fails on a missing one. Names the helper knows how to install: dbmate.
# May be EMPTY.
INSTALLABLE_TOOLS="dbmate"

# dbmate: pinned release and the sha256 of its linux-arm64 binary (the Pi's only platform).
# The download URL is built from the version:
#   https://github.com/amacneil/dbmate/releases/download/v<version>/dbmate-linux-arm64
# To upgrade: change both lines (sha256sum the downloaded dbmate-linux-arm64 file).
DBMATE_VERSION="2.36.0"
DBMATE_SHA256_ARM64="c7d49db4b54e487eddf8ce7d6e88f4035e1eb04c7edb16008f668cdfad2f29e8"

# Playwright browsers to install with the venv's own Playwright (names: chromium firefox
# webkit). May be EMPTY.
PLAYWRIGHT_BROWSERS="chromium"
