# deploy/scripts/autodeploy.conf
# Plain KEY=value lines. Values are NOT shell-expanded. Quote values with spaces.
# Keys are added here as each step helper is built.

# Ordered step lists; each name maps to lib/step_<name>.py.
# (A name whose helper does not exist yet reports NOT IMPLEMENTED and stops
#  the run cleanly.)
TEST_STEPS="preflight checkout dependencies db_prepare migrate regression stop_services start_services smoke manual_gate"
PRD_STEPS="preflight stop_services checkout dependencies db_baseline migrate start_services regression smoke"

# Directory holding <env>.env (test.env / prd.env). Absolute path, REQUIRED.
# This is the only value that cannot live in the env file itself.
ENV_FILE_DIR="/home/god/.config/pifitness"

# test.env and prd.env have IDENTICAL keys; only the values differ (APP_DIR, not
# PRD_APP_DIR). The file chosen by --environment IS the environment. Machine-specific
# values live ONLY in those files and have NO default anywhere in the scripts.
#
# Keys that must exist AND be non-empty in <ENV_FILE_DIR>/<env>.env. REQUIRED.
# (APP_ENV and LOG_DIR are always required by new_run.py even if not listed.)
#   APP_ENV              must equal TEST_APP_ENV / PRD_APP_ENV below
#   PG_HOST PG_PORT PG_USER PG_DB   this environment's database
#   LOG_DIR              autodeploy logs
#   APP_DIR              the application checkout directory
#   VENV_DIR             python venv (must be OUTSIDE APP_DIR)
#   STATE_FILE           database state marker (clean|dirty|migrated)
#   PG_BACKUP_LOCATION   directory of nightly dumps (and pinned baseline dumps)
#   BACKUP_GLOB          filename pattern of the nightly dumps in that directory
REQUIRED_ENV_KEYS="APP_ENV PG_HOST PG_PORT PG_USER PG_DB LOG_DIR APP_DIR VENV_DIR STATE_FILE PG_BACKUP_LOCATION BACKUP_GLOB"
# Keys that must be PRESENT but may have an empty value. REQUIRED (may itself be empty).
REQUIRED_ENV_KEYS_MAY_BE_EMPTY="PG_PASSWORD"

# The APP_ENV value each environment's env file must carry. REQUIRED.
TEST_APP_ENV="test"
PRD_APP_ENV="prod"

# ---------------------------------------------------------------------------
# step_preflight.py
# ---------------------------------------------------------------------------
# systemd units (VERIFY these names against the Pi). Timers may be empty.
TEST_SERVICES="pifitness-fastapi-test.service"
TEST_TIMERS=""
PRD_SERVICES="pifitness-fastapi.service pifitness_agent.service"
PRD_TIMERS="pifitness_agent.timer pifitness-hardware-health.timer"

# Binaries that must be on PATH. psql, pg_dump, pg_restore and systemctl are
# always required by the preflight itself, whatever is listed here.
REQUIRED_TOOLS="git dbmate uv node npm psql pg_dump pg_restore systemctl"
# Tools the dependencies step installs: reported present/missing, never a failure.
INSTALLABLE_TOOLS="dbmate"

# Command used to query/stop/start units (e.g. "sudo -n systemctl" if the run
# needs sudo). REQUIRED. The preflight uses it read-only; later steps use the same key.
SYSTEMCTL="systemctl"

# Script run automatically if any TEST unit is active (relative to deploy/scripts/). REQUIRED.
TEST_DOWN_SCRIPT="test-down.sh"
TEST_DOWN_TIMEOUT="180"

# dbmate's applied-migrations table, and how a TEST database is marked as TEST
# (the database COMMENT must equal this text; the TEST clone/restore step sets it).
MIGRATIONS_TABLE="schema_migrations"
TEST_DB_MARKER="pifitness-test-database"

# Nightly PRD snapshots: warn when the newest is older than this many hours. REQUIRED (TEST run).
BACKUP_WARN_AGE_HOURS="36"

# Files/dirs carried across a checkout swap (relative to the app dir, or absolute).
PERSISTENT_RESOURCES=""
