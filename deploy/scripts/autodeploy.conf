# deploy/scripts/autodeploy.conf
# Plain KEY=value lines. Values are NOT shell-expanded. Quote values with spaces.
# Keys are added here as each step helper is built.

# Ordered step lists; each name maps to lib/step_<name>.py.
# (A name whose helper does not exist yet reports NOT IMPLEMENTED and stops
#  the run cleanly.)
TEST_STEPS="preflight checkout dependencies db_prepare migrate regression stop_services start_services smoke manual_gate"
PRD_STEPS="preflight stop_services checkout dependencies db_baseline migrate start_services regression smoke"

# Directory holding <env>.env (test.env / prd.env). Absolute path, REQUIRED.
# This is the only value that cannot live in the env file itself.
ENV_FILE_DIR="/home/god/.config/pifitness"

# test.env and prd.env have IDENTICAL keys; only the values differ (APP_DIR, not
# PRD_APP_DIR). The file chosen by --environment IS the environment. Machine-specific
# values live ONLY in those files and have NO default anywhere in the scripts.
#
# Keys that must exist AND be non-empty in <ENV_FILE_DIR>/<env>.env. REQUIRED.
# (APP_ENV and LOG_DIR are always required by new_run.py even if not listed.)
#   APP_ENV              must equal TEST_APP_ENV / PRD_APP_ENV below
#   PG_HOST PG_PORT PG_USER PG_DB   this environment's database
#   LOG_DIR              autodeploy logs
#   APP_DIR              the application checkout directory
#   VENV_DIR             python venv (must be OUTSIDE APP_DIR)
#   STATE_FILE           database state marker (clean|dirty|migrated)
#   PG_BACKUP_LOCATION   directory of nightly dumps (and pinned baseline dumps)
#   BACKUP_GLOB          filename pattern of the nightly dumps in that directory
REQUIRED_ENV_KEYS="APP_ENV PG_HOST PG_PORT PG_USER PG_DB LOG_DIR APP_DIR VENV_DIR STATE_FILE PG_BACKUP_LOCATION BACKUP_GLOB"
# Keys that must be PRESENT but may have an empty value. REQUIRED (may itself be empty).
REQUIRED_ENV_KEYS_MAY_BE_EMPTY="PG_PASSWORD"

# The APP_ENV value each environment's env file must carry. REQUIRED.
TEST_APP_ENV="test"
PRD_APP_ENV="prod"

# ---------------------------------------------------------------------------
# step_preflight.py
# ---------------------------------------------------------------------------
# systemd units are NOT listed here. Two sets are worked out at run time:
#   SERVICES_LIST / TIMERS_LIST      the *.service / *.timer files in the commit's
#                                    deploy/systemd (the units the commit defines; what a
#                                    deploy starts). Any mix is fine, including none.
#                                    Every timer needs a same-named service (X.timer drives
#                                    X.service); a service may exist without a timer.
#   ACTIVE_SERVICES / ACTIVE_TIMERS  every PiFitness unit running on the Pi when the run
#                                    begins, including units named like the commit's own
#                                    (what gets stopped, and later restored).
# Stop: timers first, then services. Start and restore: timers plus services that have no
# same-named timer (a timer-paired service is never started directly).
# The one thing neither source can say is which of the Pi's units are PiFitness's. That
# is this PATTERN (not a list), so it never needs editing when units come and go. It must
# start with literal text: "*" would sweep up sshd and everything else.
UNIT_NAME_GLOB="pifitness*"

# Binaries that must be on PATH. psql, pg_dump, pg_restore and systemctl are
# always required by the preflight itself, whatever is listed here. Tools that
# tools.conf lists under INSTALLABLE_TOOLS (installed by the dependencies step) are
# reported present/missing, never a failure.
REQUIRED_TOOLS="git dbmate uv node npm psql pg_dump pg_restore systemctl"

# Command used to query/stop/start/enable units. Units live in UNIT_INSTALL_DIR (root-owned),
# so this needs sudo. REQUIRED. The sudoers entry for the deploy user must allow: systemctl.
SYSTEMCTL="sudo -n systemctl"

# ---------------------------------------------------------------------------
# Unit handling (step_stop_services, step_start_services, undo_units).
# Process, identical for TEST and PRD: poll the Pi for every UNIT_NAME_GLOB unit, stop it,
# move its unit file aside, install the commit's deploy/systemd units, enable + start them.
# TEST (any outcome) and a failed PRD put the originals back; a successful PRD deletes them.
# ---------------------------------------------------------------------------
# Where systemd units are installed on the Pi. Absolute. REQUIRED.
UNIT_INSTALL_DIR="/etc/systemd/system"

# Prefix for commands that write UNIT_INSTALL_DIR (mv, install, rm, test). May be EMPTY
# only when the deploy user can write that directory directly.
# The sudoers entry must allow: mv, install, rm, test.
PRIVILEGE_CMD="sudo -n"

# Placeholders the commit's unit files may use as @KEY@. Each KEY must exist in the Pi env
# file (test.env / prd.env); its value is substituted when the unit is installed. This is
# what points TEST units at the TEST app dir and PRD units at the PRD app dir.
# Example in a unit file:  WorkingDirectory=@APP_DIR@   ExecStart=@VENV_DIR@/bin/python3 ...
# May be EMPTY (units with no placeholders).
UNIT_PLACEHOLDERS="APP_DIR VENV_DIR"

# Seconds to wait for one unit to stop / to become healthy after start. REQUIRED.
UNIT_STOP_TIMEOUT_SECONDS="120"
UNIT_START_TIMEOUT_SECONDS="120"

# dbmate's applied-migrations table, and how a TEST database is marked as TEST
# (the database COMMENT must equal this text; the TEST clone/restore step sets it).
MIGRATIONS_TABLE="schema_migrations"
MIGRATIONS_SCHEMA="public"
TEST_DB_MARKER="pifitness-test-database"

# Nightly PRD snapshots: warn when the newest is older than this many hours. REQUIRED (TEST run).
BACKUP_WARN_AGE_HOURS="36"

# Files/dirs carried across a checkout swap (relative to the app dir, or absolute).
PERSISTENT_RESOURCES=""

# ---------------------------------------------------------------------------
# step_dependencies.py   (pinned non-pip tools live in tools.conf, not here)
# ---------------------------------------------------------------------------
# Extra arguments for `uv sync --locked --no-editable`: which extras / dependency groups the
# Pi venv carries. "--extra dev" brings pytest (the regression step runs it on the Pi);
# "--group deployment" brings migradiff. May be EMPTY.
DEPENDENCY_GROUPS="--extra dev --group deployment"
