[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = --color=yes -ra --strict-markers
pythonpath = backend backend/pifitness
markers =
    slow: excluded from fast lane; per-test reason goes in reason= kwarg.
    integration: test requires real external dependency (Postgres, filesystem, subprocess). No network.
    live: test requires live network access (Spotify/Garmin API). Never blocks a commit.
    unit: Pure logic or algorithm checked with real inputs and outputs.
    contract: Boundary behavior callers depend on: HTTP status codes, payload shapes, return values.
    regression: Guards a named failure class: silent success, lost atomicity, swallowed errors.
    quarantine: Skipped unless --run-quarantine; carries reason= and exit=.
    smoke: fast import + API-shape check. Tier 0.