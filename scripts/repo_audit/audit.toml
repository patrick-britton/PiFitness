# ---- TARGET layering rules (flip enabled = true when Phase 3 lands) --------------------------
[[forbid]]
name = "core-is-the-bottom-layer"
enabled = false
from = ["backend/pifitness/core/**"]
to = ["backend/pifitness/domains/**", "backend/pifitness/api/**", "backend/pifitness/worker/**", "backend/pifitness/integrations/**"]

[[forbid]]
name = "domains-do-not-import-api"
enabled = false
from = ["backend/pifitness/domains/**"]
to = ["backend/pifitness/api/**"]

[[forbid]]
name = "worker-does-not-import-api"
enabled = false
from = ["backend/pifitness/worker/**"]
to = ["backend/pifitness/api/**"]
