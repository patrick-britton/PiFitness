[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pifitness"
version = "0.1.0"
description = "PiFitness API Backend"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "psycopg2-binary>=2.9.6",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    # Testing
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = ["pifitness"]
