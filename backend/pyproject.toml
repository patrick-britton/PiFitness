[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pifitness"
version = "0.1.0"
description = "PiFitness API Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.51",
    "pandas==3.0.3",
    "numpy==2.5.0",
    "requests==2.34.2",
    "httpx==0.28.1",
    "spotipy==2.26.0",
    "garminconnect==0.3.6",
    "cryptography==49.0.0",
    "scipy==1.18.0",
    "pytz==2026.2",
    "pydantic==2.13.4",
    "starlette==1.3.1",
    "playwright==1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[dependency-groups]
# Tools required by the deployment/bootstrap workflow, not by the API runtime.
deployment = [
    "migradiff[pg]==1.7.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pifitness*", "backend_functions*"]
