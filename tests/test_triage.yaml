# =============================================================================
# PiFitness test-suite triage config
# Consumed by apply_test_triage.py (dry-run by default; --apply to write).
#
# Every `test*` function in every tests/**/test_*.py file must have an entry.
#
#   decision: keep        runs by default
#   decision: quarantine  stays in the file, tagged and skipped unless
#                         --run-quarantine; must leave quarantine via its `exit`
#   decision: delete      function removed (decorators included)
#
# keep / quarantine entries
#   category     one of policy.categories (becomes the single purpose marker)
#   description  one falsifiable sentence about caller-visible behavior; becomes
#                the docstring. Linted: ends with a period, no story IDs, no
#                "Test..." opener, no newlines.
#   live         true  -> @pytest.mark.live (needs the real DB or an external service)
#   slow         "why" -> @pytest.mark.slow(reason=...) (no reason, no slow marker)
#   weak         "why" -> keep, but first to go: --prune-weak treats it as delete
#   rename_to    new function name (used to revive tests pytest never collected)
#   new          true  -> defined in the file's `append_source`
#   note         free text for humans, ignored by the tool
# quarantine entries also need
#   reason       why it is not trusted today
#   exit         one of policy.quarantine_exits
# delete entries need only `reason` (audit trail; no category or description).
#
# file-level keys: module_docstring, remove_symbols, append_source,
#                  strip_module_pytestmark (default true)
# =============================================================================
version: 1
policy:
  categories:
    unit: Pure logic or algorithm checked with real inputs and outputs; no collaborators mocked except the clock or network edge.
    contract: 'Boundary behavior callers depend on: HTTP status codes and payload shapes, serializers, query-function return values.'
    regression: 'Guards a named failure class: silent success, lost atomicity, swallowed errors, polluted data, destructive writes.'
    integration: Exercises real wiring against the real database or an external service.
    smoke: Coarse proof that a route or app is wired and alive; asserts almost nothing about content.
  environment_markers:
    live: Needs the real database or an external service; excluded from the hermetic run (-m 'not live').
    slow: 'Only with a written reason: @pytest.mark.slow(reason=...).'
  quarantine_exits:
    rewrite_against_db: Replace SQL-text or mock-call assertions with a test against a disposable database.
    vendor_fixture: Move the off-tree fixture file under tests/fixtures/ and point the test at it.
    verify_then_promote: Run once, repair stale patch targets, then promote to keep or delete.
    manual_gate: Live check that is only meaningful when a human runs it on purpose.
