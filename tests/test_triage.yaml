  #
  # NOT a pytest test module: a diagnostic script. Its body runs at import
  # time (there is no `if __name__ == "__main__":` guard), imports
  # backend_functions.database_functions, and calls load_dotenv() twice,
  # which mutates PG_HOST/PG_USER/PG_PORT/PG_DB in os.environ for the whole
