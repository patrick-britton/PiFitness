      test_executioner_reconciles_no_work_as_success:
        decision: keep
        category: regression
        description: ultimate_task_executioner reconciles an empty work queue as one successful run and reports the task as successful.
      test_nonempty_all_failed_still_fails:
        decision: keep
        category: regression
        description: ultimate_task_executioner reconciles a non-empty queue whose API calls all fail as one failure carrying the API error and reports the task as failed.

