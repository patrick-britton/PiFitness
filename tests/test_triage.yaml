      test_leaderboard_segments_contract_shape:
        decision: keep
        category: contract
        description: GET /api/activities/leaderboard/segments returns a bare list of segment rows carrying the eight list fields, with nulls preserved.
      test_leaderboard_segments_filters_forwarded:
        decision: keep
        category: contract
        description: GET /api/activities/leaderboard/segments forwards the name, kind, min_distance and activity_type filters to the query helper and treats an empty name as no filter.
        note: bundles two cases; split when convenient
      test_leaderboard_segments_invalid_params:
        decision: keep
        category: contract
        description: GET /api/activities/leaderboard/segments rejects an unknown kind, an unsupported activity_type and a negative min_distance with 422.
      test_segment_bulk_reject_full_and_threshold:
        decision: quarantine
        category: contract
        description: POST /api/segments/{id}/matches/bulk-reject rejects every pending candidate, or only those strictly above confidence_over, and reports the rejected count.
        reason: asserts SQL text and cursor call counts on a MagicMock connection; the strict-threshold semantics need a real database
        exit: rewrite_against_db
      test_segment_bulk_reject_failure_rolls_back:
        decision: keep
        category: regression
        description: POST /api/segments/{id}/matches/bulk-reject rolls the whole batch back, never commits, and returns 422 when any single rejection fails.
      test_segment_bulk_reject_empty_404_422:
        decision: keep
        category: contract
        description: POST /api/segments/{id}/matches/bulk-reject returns rejected 0 without opening a write connection when no candidates exist, 404 for an unknown segment and 422 for a malformed body.
        note: bundles three cases; split when convenient
