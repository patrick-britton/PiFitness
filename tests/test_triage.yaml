  tests/test_failure_propagation.py:
    module_docstring: A failed sub-step is never reported as success, and each task run is reconciled exactly once with the detailed message.
    tests:
      test_post_processing_processes_all_then_raises_aggregate:
        decision: keep
        category: regression
        description: activity_post_processing processes every queued activity after a failure, then raises one error naming the failed activities, step and reason.
      test_post_processing_success_returns_true:
        decision: keep
        category: regression
        description: activity_post_processing returns True after processing every queued activity when no sub-step fails.
      test_post_processing_empty_queue_returns_true:
        decision: keep
        category: regression
        description: activity_post_processing returns True without processing anything when the queue is empty.
        weak: trivial branch; the empty-queue contract is also covered at the executioner level
      test_execute_python_returns_failure_message_without_reconciling:
        decision: keep
        category: regression
        description: execute_python returns a failing function's error text and does not reconcile task dates itself.
      test_execute_python_success_returns_none:
        decision: delete
        reason: subsumed by the executioner success test
      test_executioner_reconciles_failed_with_ids_in_message:
        decision: keep
