        description: ultimate_task_executioner reconciles a failed python task exactly once with the failure message and reports success False with that error.
      test_executioner_reports_success_when_all_pass:
        decision: keep
        category: regression
        description: ultimate_task_executioner reconciles a passing python task exactly once as a success and reports success True with no error.
